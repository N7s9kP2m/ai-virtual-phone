<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI 声音克隆与音色工坊</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --border-active: #a855f7;
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --accent: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at 50% 0%, #2e1065 0%, #0b0f19 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 12px 60px 12px;
    }
    .container {
      width: 100%;
      max-width: 580px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 14px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      font-size: 24px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #f8fafc 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .badge.ready {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .badge.ready::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }
    .badge.fail {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .badge.fail::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .input-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border 0.2s;
    }
    .input-box:focus {
      border-color: var(--primary);
    }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-success {
      background: #059669;
      color: #fff;
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-sm {
      padding: 5px 9px;
      font-size: 11px;
      border-radius: 6px;
    }
    .voice-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .voice-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      transition: border 0.2s, background 0.2s;
    }
    .voice-item.is-default {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
    }
    .voice-item-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .voice-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .voice-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #f8fafc;
    }
    .default-tag {
      font-size: 10px;
      background: #f59e0b;
      color: #1e1b4b;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 800;
    }
    .voice-meta {
      font-size: 11px;
      color: var(--text-muted);
    }
    .voice-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .audio-player {
      width: 100%;
      height: 36px;
      margin-top: 8px;
      display: none;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      margin-bottom: 8px;
    }
    .slider-label {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 65px;
    }
    .slider {
      flex: 1;
      height: 5px;
      border-radius: 5px;
      accent-color: var(--primary);
    }
    .toast-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }
    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部状态栏 -->
    <div class="header">
      <div class="brand">
        <span class="brand-icon">🎙️</span>
        <span class="brand-title">AI 声音克隆与音色工坊</span>
      </div>
      <div class="badge" id="serverStatusBadge">检测连接中...</div>
    </div>

    <!-- 服务器设置卡片 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">⚙️ 服务端连接配置</span>
        <button class="btn btn-outline btn-sm" id="btnPing">🔄 测试连接</button>
      </div>
      <div class="input-row">
        <input type="text" class="input-box" id="serverUrlInput" placeholder="http://192.168.31.188:8191" />
        <button class="btn btn-primary btn-sm" id="btnSaveUrl">保存</button>
      </div>
    </div>

    <!-- 已建档声音库 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">👑 专属克隆声音库</span>
        <span style="font-size:11px; color:var(--accent);" id="voiceCountLabel">0 个音色</span>
      </div>
      <div class="voice-grid" id="voiceListContainer">
        <div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12px;">正在加载音色列表...</div>
      </div>
      <audio id="previewAudioPlayer" class="audio-player" controls></audio>
    </div>

    <!-- 试听与调速测试 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">🎧 语音合成与调速试听</span>
      </div>
      <div class="input-row">
        <input type="text" class="input-box" id="synthTextInput" value="你好，我是专属于你的 AI 伙伴，今天想听我说些什么呢？" />
      </div>
      <div class="slider-row">
        <span class="slider-label" id="speedLabel">语速 (0.85x)</span>
        <input type="range" class="slider" id="speedSlider" min="0.5" max="1.5" step="0.05" value="0.85" />
      </div>
      <button class="btn btn-primary" style="width:100%;" id="btnTestSynth">▶️ 立即合成并试听</button>
      <audio id="synthAudioPlayer" class="audio-player" controls></audio>
    </div>

    <!-- 录制 / 上传克隆新声音 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">✨ 克隆建档新声音</span>
      </div>
      <div class="input-row">
        <input type="text" class="input-box" id="cloneNameInput" placeholder="角色名称 (例如：流萤 / 钟离)" />
      </div>
      <div class="input-row">
        <input type="text" class="input-box" id="cloneRefTextInput" placeholder="参考音频所念的台词内容 (可选，推荐填写)" />
      </div>
      <div class="input-row" style="align-items:center;">
        <input type="file" id="audioFileInput" accept="audio/*" style="display:none;" />
        <button class="btn btn-outline" style="flex:1;" id="btnSelectFile">📁 选择本地音频文件</button>
        <button class="btn btn-outline" id="btnRecordMic">🎤 手机录音 (10s)</button>
      </div>
      <div id="selectedFileTip" style="font-size:11px; color:var(--accent); margin-bottom:8px; display:none;"></div>
      <button class="btn btn-success" style="width:100%;" id="btnSubmitClone">🚀 立即开始克隆并建档</button>
    </div>
  </div>

  <div class="toast-box" id="toastBox"></div>

  <script>
  (function(){
    var defaultHost = (location.hostname && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1')
      ? 'http://' + location.hostname + ':8191'
      : 'http://192.168.31.188:8191';

    var currentServer = localStorage.getItem('ai_voice_workshop_server') || defaultHost;
    var elServerInput = document.getElementById('serverUrlInput');
    var elStatusBadge = document.getElementById('serverStatusBadge');
    var elVoiceList = document.getElementById('voiceListContainer');
    var elVoiceCount = document.getElementById('voiceCountLabel');
    var elPlayer = document.getElementById('previewAudioPlayer');
    var elSynthPlayer = document.getElementById('synthAudioPlayer');
    var elSpeedSlider = document.getElementById('speedSlider');
    var elSpeedLabel = document.getElementById('speedLabel');
    var elToast = document.getElementById('toastBox');

    elServerInput.value = currentServer;

    function toast(msg) {
      if (window.AiPhone && window.AiPhone.ui && window.AiPhone.ui.toast) {
        window.AiPhone.ui.toast(msg);
      }
      elToast.textContent = msg;
      elToast.classList.add('show');
      setTimeout(function(){ elToast.classList.remove('show'); }, 2800);
    }

    function getServer() {
      return (elServerInput.value || currentServer).replace(/\/+$/, '');
    }

    elSpeedSlider.addEventListener('input', function() {
      elSpeedLabel.textContent = '语速 (' + elSpeedSlider.value + 'x)';
    });

    document.getElementById('btnSaveUrl').addEventListener('click', function() {
      var val = elServerInput.value.trim();
      if (!val) val = defaultHost;
      localStorage.setItem('ai_voice_workshop_server', val);
      toast('✅ 服务端地址已保存！');
      checkStatus();
    });

    document.getElementById('btnPing').addEventListener('click', function() {
      checkStatus(true);
    });

    async function checkStatus(showMsg) {
      elStatusBadge.className = 'badge';
      elStatusBadge.textContent = '连接检测中...';
      try {
        var resp = await fetch(getServer() + '/api/health', { method: 'GET' });
        if (resp.ok) {
          elStatusBadge.className = 'badge ready';
          elStatusBadge.textContent = '8191 正常连通';
          if (showMsg) toast('✅ 服务端状态极佳！');
          loadVoices();
        } else {
          throw new Error('HTTP ' + resp.status);
        }
      } catch(e) {
        elStatusBadge.className = 'badge fail';
        elStatusBadge.textContent = '未连通';
        if (showMsg) toast('❌ 连接失败：' + e.message);
      }
    }

    var cachedVoices = [];
    var currentDefaultVoice = '';

    async function loadVoices() {
      try {
        var resp = await fetch(getServer() + '/api/voices');
        var data = await resp.json();
        cachedVoices = data.voices || [];
        currentDefaultVoice = data.default_voice || '';
        renderVoices();
      } catch(e) {
        elVoiceList.innerHTML = '<div style="text-align:center; padding:16px; color:#f87171; font-size:12px;">加载音色失败：' + e.message + '</div>';
      }
    }

    function renderVoices() {
      elVoiceCount.textContent = cachedVoices.length + ' 个音色';
      if (!cachedVoices.length) {
        elVoiceList.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12px;">暂无音色，请在下方录制或上传！</div>';
        return;
      }
      elVoiceList.innerHTML = '';
      cachedVoices.forEach(function(v) {
        var isDef = (v.name === currentDefaultVoice);
        var item = document.createElement('div');
        item.className = 'voice-item' + (isDef ? ' is-default' : '');
        item.innerHTML = 
          '<div class="voice-item-info">' +
            '<div class="voice-name-row">' +
              '<span class="voice-name">' + escapeHtml(v.name) + '</span>' +
              (isDef ? '<span class="default-tag">🌟 默认音色</span>' : '') +
            '</div>' +
            '<div class="voice-meta">' + (v.created_at || '已建档') + '</div>' +
          '</div>' +
          '<div class="voice-actions">' +
            '<button class="btn btn-outline btn-sm btn-play" data-name="' + escapeHtml(v.name) + '">▶️ 试听</button>' +
            (!isDef ? '<button class="btn btn-primary btn-sm btn-set-def" data-name="' + escapeHtml(v.name) + '">设为默认</button>' : '') +
            '<button class="btn btn-outline btn-sm btn-del" style="color:#f87171;" data-name="' + escapeHtml(v.name) + '">🗑️</button>' +
          '</div>';
        elVoiceList.appendChild(item);
      });

      // 绑定按钮事件
      elVoiceList.querySelectorAll('.btn-play').forEach(function(b) {
        b.addEventListener('click', function() {
          var name = b.getAttribute('data-name');
          elPlayer.src = getServer() + '/api/voices/' + encodeURIComponent(name) + '/audio?t=' + Date.now();
          elPlayer.style.display = 'block';
          elPlayer.play();
          toast('正在试听【' + name + '】原始参考语音');
        });
      });

      elVoiceList.querySelectorAll('.btn-set-def').forEach(function(b) {
        b.addEventListener('click', async function() {
          var name = b.getAttribute('data-name');
          try {
            var resp = await fetch(getServer() + '/api/voices/default', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: name })
            });
            if (resp.ok) {
              toast('🌟 已将【' + name + '】设为小手机全局默认音色！');
              loadVoices();
            }
          } catch(e) {
            toast('设置失败：' + e.message);
          }
        });
      });

      elVoiceList.querySelectorAll('.btn-del').forEach(function(b) {
        b.addEventListener('click', async function() {
          var name = b.getAttribute('data-name');
          if (!confirm('确定要删除音色【' + name + '】吗？')) return;
          try {
            var resp = await fetch(getServer() + '/api/voices/' + encodeURIComponent(name), { method: 'DELETE' });
            if (resp.ok) {
              toast('已删除音色【' + name + '】');
              loadVoices();
            }
          } catch(e) {
            toast('删除失败：' + e.message);
          }
        });
      });
    }

    // 合成并测试试听
    document.getElementById('btnTestSynth').addEventListener('click', async function() {
      var btn = this;
      var text = document.getElementById('synthTextInput').value.trim();
      var speed = parseFloat(elSpeedSlider.value) || 0.85;
      if (!text) return toast('请输入测试文本！');

      var targetVoice = currentDefaultVoice || (cachedVoices[0] && cachedVoices[0].name) || '复件 最终版';
      btn.disabled = true;
      btn.textContent = '⏳ RTX 5070 Ti 极速推理中...';

      try {
        var resp = await fetch(getServer() + '/api/tts/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voice: targetVoice, text: text, speed: speed })
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var blob = await resp.blob();
        elSynthPlayer.src = URL.createObjectURL(blob);
        elSynthPlayer.style.display = 'block';
        elSynthPlayer.play();
        toast('✅ 合成完成，正在播放！');
      } catch(e) {
        toast('合成失败：' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '▶️ 立即合成并试听';
      }
    });

    // 文件选择
    var selectedAudioBlob = null;
    var elFileInput = document.getElementById('audioFileInput');
    var elFileTip = document.getElementById('selectedFileTip');

    document.getElementById('btnSelectFile').addEventListener('click', function() {
      elFileInput.click();
    });

    elFileInput.addEventListener('change', function() {
      if (elFileInput.files && elFileInput.files[0]) {
        var f = elFileInput.files[0];
        selectedAudioBlob = f;
        elFileTip.textContent = '已选择文件: ' + f.name + ' (' + Math.round(f.size/1024) + 'KB)';
        elFileTip.style.display = 'block';
      }
    });

    // 麦克风录音
    var mediaRecorder = null;
    var recordedChunks = [];
    var isRecording = false;
    var btnRec = document.getElementById('btnRecordMic');

    btnRec.addEventListener('click', async function() {
      if (!isRecording) {
        try {
          var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onstop = function() {
            selectedAudioBlob = new Blob(recordedChunks, { type: 'audio/wav' });
            elFileTip.textContent = '已完成麦克风录音 (' + Math.round(selectedAudioBlob.size/1024) + 'KB)';
            elFileTip.style.display = 'block';
            stream.getTracks().forEach(function(t){ t.stop(); });
          };
          mediaRecorder.start();
          isRecording = true;
          btnRec.textContent = '⏹️ 停止录音';
          btnRec.style.borderColor = '#ef4444';
          btnRec.style.color = '#ef4444';
          toast('正在录音中，请说话...');
        } catch(e) {
          toast('麦克风权限获取失败：' + e.message);
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isRecording = false;
        btnRec.textContent = '🎤 手机录音';
        btnRec.style.borderColor = '';
        btnRec.style.color = '';
        toast('录音已结束');
      }
    });

    // 提交克隆
    document.getElementById('btnSubmitClone').addEventListener('click', async function() {
      var name = document.getElementById('cloneNameInput').value.trim();
      var refText = document.getElementById('cloneRefTextInput').value.trim();
      if (!name) return toast('请输入角色音色名称！');
      if (!selectedAudioBlob) return toast('请先选择本地音频或进行录音！');

      var fd = new FormData();
      fd.append('name', name);
      fd.append('ref_text', refText);
      fd.append('audio', selectedAudioBlob, 'ref_audio.wav');

      var btn = this;
      btn.disabled = true;
      btn.textContent = '⏳ 正在传输与克隆建档中...';

      try {
        var resp = await fetch(getServer() + '/api/voices/upload', {
          method: 'POST',
          body: fd
        });
        var res = await resp.json();
        if (res.status === 'success') {
          toast('🎉 音色【' + name + '】克隆建档成功！');
          document.getElementById('cloneNameInput').value = '';
          document.getElementById('cloneRefTextInput').value = '';
          selectedAudioBlob = null;
          elFileTip.style.display = 'none';
          loadVoices();
        } else {
          throw new Error(res.message || '建档失败');
        }
      } catch(e) {
        toast('克隆失败：' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 立即开始克隆并建档';
      }
    });

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    checkStatus();
  })();
  </script>
</body>
</html>
